<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="black"/>
  <g fill="white" opacity="0.7">
    <!-- Row 1 -->
    <text x="30" y="40" font-size="18" font-family="monospace">&lt;/&gt;</text>
    <text x="180" y="55" font-size="14" font-family="monospace" transform="rotate(-15,180,55)">{ }</text>
    <text x="310" y="35" font-size="16" font-family="monospace" transform="rotate(10,310,35)">&lt;/&gt;</text>

    <!-- Row 2 -->
    <text x="80" y="120" font-size="12" font-family="monospace" transform="rotate(20,80,120)">( )</text>
    <text x="250" y="110" font-size="18" font-family="monospace">&lt;/&gt;</text>
    <text x="370" y="130" font-size="11" font-family="monospace" transform="rotate(-10,370,130)">{ }</text>

    <!-- Row 3 -->
    <text x="20" y="195" font-size="15" font-family="monospace" transform="rotate(-8,20,195)">&lt;/&gt;</text>
    <text x="150" y="210" font-size="12" font-family="monospace" transform="rotate(12,150,210)">[ ]</text>
    <text x="300" y="200" font-size="16" font-family="monospace">&lt;/&gt;</text>

    <!-- Row 4 -->
    <text x="60" y="280" font-size="14" font-family="monospace" transform="rotate(5,60,280)">{ }</text>
    <text x="200" y="290" font-size="17" font-family="monospace" transform="rotate(-12,200,290)">&lt;/&gt;</text>
    <text x="350" y="275" font-size="13" font-family="monospace">( )</text>

    <!-- Row 5 -->
    <text x="40" y="360" font-size="16" font-family="monospace" transform="rotate(8,40,360)">&lt;/&gt;</text>
    <text x="170" y="370" font-size="12" font-family="monospace" transform="rotate(-5,170,370)">{ }</text>
    <text x="320" y="355" font-size="15" font-family="monospace" transform="rotate(15,320,355)">&lt;/&gt;</text>
  </g>
</svg>
